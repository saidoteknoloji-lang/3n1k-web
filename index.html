<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yer Adları - Türkiye'nin Yer İsimleri Hafızası</title>
    <meta name="description" content="Türkiye'deki il, ilçe ve yer adlarının anlamlarını, kökenlerini ve kültürel hafızasını keşfedin.">
    <link rel="canonical" href="https://3n1k-web.vercel.app/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS (Harita için hazır altyapı) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Kendi CSS Dosyamızı Bağlıyoruz -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ÜST MENÜ (HEADER) -->
    <header>
        <div class="header-left">
            <!-- LOGO -->
            <div class="logo">
                <a href="index.html">
                    <h1><span>Yer</span> Adları</h1>
                </a>
            </div>
        </div>

        <!-- Sağ taraftaki menü (masaüstünde sağda görünür) -->
        <nav id="mainNav" class="header-right">
            <ul>
                <li><a href="hakkimizda.html">Hakkımızda</a></li>
                <li><a href="ekle.html">Ekle</a></li>
                <li>
                    <a href="#" id="profileBtn" class="profile-link" aria-label="Hesabım">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                            <path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5zm0 2c-4.418 0-8 1.79-8 4v2h16v-2c0-2.21-3.582-4-8-4z" />
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- ARAMA ALANI (HERO) -->
    <section class="hero" id="heroSection">
        <div class="hero-content" id="heroContent">
            <h2>Neredeyim? Hikayesini Keşfet!</h2>
            <div class="search-container">
                <div class="search-input-wrap">
                    <input type="text" id="searchInput" placeholder="İl, ilçe veya köy adı yazın..." autocomplete="off">
                    <!-- Arama Sonuçları Dropdown -->
                    <div class="search-results-box" id="searchResults">
                        <!-- Sonuçlar JS ile buraya eklenecek -->
                    </div>
                    <p id="searchMessage" class="search-message" aria-live="polite"></p>
                </div>
                <button id="searchBtn">Ara</button>
            </div>
        </div>
    </section>

    <!-- HARİTA (LEAFLET) BÖLÜMÜ -->
    <section class="map-section">
        <div class="map-placeholder" id="map">
            <!-- Buraya Leaflet JS ile harita yüklenecek -->
            Türkiye Haritası (Leaflet) Yükleniyor...
        </div>
    </section>

    <!-- FOOTER -->
    <!-- Authentication panel (hidden by default) -->
    <div id="authOverlay" class="auth-overlay" aria-hidden="true">
        <div class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="authTitle">
            <button class="auth-close" id="authClose" aria-label="Kapat">✕</button>
            <h3 id="authTitle">Hesap</h3>
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Giriş Yap</button>
                <button class="tab-btn" data-tab="register">Kayıt Ol</button>
            </div>
            <div class="auth-forms">
                <form id="loginForm" class="auth-form">
                    <label>E-posta<input type="email" id="loginEmail" required></label>
                    <label>Şifre<input type="password" id="loginPass" required></label>
                    <button type="submit" class="primary">Giriş Yap</button>
                </form>
                <form id="registerForm" class="auth-form" style="display:none;">
                    <label>Kullanıcı adı<input type="text" id="regUsername" minlength="3" maxlength="30" required></label>
                    <label>E-posta<input type="email" id="regEmail" required></label>
                    <label>Şifre<input type="password" id="regPass" required></label>
                    <button type="submit" class="primary">Kayıt Ol</button>
                </form>
            </div>
            <div id="authMsg" class="auth-msg" aria-live="polite"></div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2024 Yer Adları Projesi. <a href="hakkimizda.html">TÜBİTAK Projesi</a> kapsamında geliştirilmiştir.</p>
    </footer>

    <!-- Kendi JavaScript Dosyamızı Bağlıyoruz -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase (compat) - you will paste your config into script.js via setupFirebase(config) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
